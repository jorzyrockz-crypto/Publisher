<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudioPress — logo lab</title>
<style>
:root{
  --sp-accent:#6e56cf; --sp-accent-ink:#5c4bb8; --sp-accent-soft:#efeafd; --sp-accent-line:#d3c9f9;
  --sp-ink:#161a22; --sp-ink-secondary:#4a5661; --sp-ink-muted:#5b6673; --sp-line:#e5e9ee;
  --sp-surface:#fff; --sp-surface-sunken:#f8fafb; --sp-bg:#f3f5f7;
  --brand:#6e56cf;
}
*{box-sizing:border-box}
body{margin:0;background:var(--sp-bg);color:var(--sp-ink);
  font:13px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-0.01em}
header{position:sticky;top:0;z-index:5;background:var(--sp-surface);border-bottom:1px solid var(--sp-line);padding:14px 20px}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:15px;font-weight:750}
h1 small{display:block;font-size:11px;font-weight:500;color:var(--sp-ink-muted);letter-spacing:0}
.label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--sp-ink-muted)}
.swatches{display:flex;gap:6px}
.sw{width:22px;height:22px;border-radius:6px;border:2px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--sp-ink);box-shadow:0 0 0 2px #fff inset}
input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--sp-line);border-radius:6px;background:none;cursor:pointer}
.toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sp-ink-secondary);cursor:pointer}
.stage{display:flex;align-items:center;gap:22px;margin-top:12px;padding:12px 16px;border:1px solid var(--sp-line);border-radius:8px;background:var(--sp-surface-sunken)}
.sizes{display:flex;align-items:flex-end;gap:16px}
.size{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--sp-ink-secondary)}
.size em{font-style:normal;font-size:10px;color:var(--sp-ink-muted);letter-spacing:.02em}
main{padding:20px;max-width:1180px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.card{background:var(--sp-surface);border:1px solid var(--sp-line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card:hover{box-shadow:0 8px 28px #1c2c3a12}
.art{height:104px;display:grid;place-items:center;background:var(--sp-surface-sunken);border:1px solid var(--sp-line);border-radius:6px}
.art svg{color:var(--brand);width:60px;height:60px}
.tilewrap{background:var(--brand);display:grid;place-items:center;border-radius:14px;padding:9px;border:0}
.tilewrap svg{color:#fff;width:56px;height:56px}
.name{font-weight:700;font-size:12px}
.note{font-size:11px;color:var(--sp-ink-muted);min-height:30px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
button.act{font:inherit;font-size:11px;font-weight:600;padding:5px 9px;border-radius:6px;cursor:pointer;
  border:1px solid var(--sp-line);background:#fff;color:var(--sp-accent-ink);transition:background .15s,border-color .15s}
button.act:hover{background:var(--sp-accent-soft);border-color:var(--sp-accent-line)}
button.act.primary{background:var(--sp-accent);border-color:var(--sp-accent);color:#fff}
button.act.primary:hover{background:var(--sp-accent-ink);border-color:var(--sp-accent-ink)}
.lockup{display:flex;align-items:center;gap:10px;font-weight:750;font-size:18px;letter-spacing:-0.02em}
.lockup svg{width:26px;height:26px;color:#fff}
.lockup .badge{background:var(--brand);border-radius:8px;padding:5px;display:grid;place-items:center}
.hint{font-size:11px;color:var(--sp-ink-muted);margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--sp-ink);color:#fff;font-size:12px;padding:8px 14px;border-radius:8px;transition:.18s}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Logo lab<small>Nine marks for StudioPress · click a colour, then export</small></h1>
    <div style="margin-left:auto" class="bar">
      <span class="label">Brand</span>
      <div class="swatches" id="swatches"></div>
      <input type="color" id="picker" value="#6e56cf" aria-label="Brand colour">
      <label class="toggle"><input type="checkbox" id="tile"> Tile</label>
      <label class="toggle"><input type="checkbox" id="lockupView"> Wordmark</label>
      <label class="toggle">Radius <input type="range" id="radius" min="4" max="22" value="14" style="width:64px"></label>
    </div>
  </div>
  <div class="stage">
    <span class="label">Legibility</span>
    <div class="sizes" id="sizes"></div>
  </div>
</header>
<main>
  <p class="hint">Every mark is a real SVG path — no bitmap, no generated image. Recolour once and all nine follow. Copy is inline SVG; PNG is rendered at 512 px.</p>
  <div class="grid" id="grid"></div>
</main>
<div class="toast" id="toast"></div>
<script>
const MARKS = [{"id": "monogram-s", "name": "Monogram S", "note": "One confident stroke. Nothing to lose at 16 px.", "svg": "<path d=\"M45 17H27.5a8.5 8.5 0 0 0 0 17h9a8.5 8.5 0 0 1 0 17H19\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"8.5\" stroke-linecap=\"round\"/>"}, {"id": "sp-lockup", "name": "S + P", "note": "Two letters sharing a rhythm; tighter than a wordmark.", "svg": "<path d=\"M33 16H21.5a6.5 6.5 0 0 0 0 13h6a6.5 6.5 0 0 1 0 13H16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linecap=\"round\"/><path d=\"M42 48V16h6.5a8 8 0 0 1 0 16H42\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>"}, {"id": "page-stack", "name": "Page stack", "note": "Three sheets, offset. Reads as a document set.", "svg": "<rect x=\"9\" y=\"14\" width=\"32\" height=\"40\" rx=\"5\" fill=\"currentColor\" opacity=\"0.22\"/><rect x=\"16\" y=\"9\" width=\"32\" height=\"40\" rx=\"5\" fill=\"currentColor\" opacity=\"0.45\"/><rect x=\"23\" y=\"15\" width=\"32\" height=\"40\" rx=\"5\" fill=\"currentColor\"/>"}, {"id": "folded-page", "name": "Folded page", "note": "Outline page with a corner fold and two text bars.", "svg": "<path d=\"M15 11h22l12 12v30a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4.5\" stroke-linejoin=\"round\"/><path d=\"M37 11v9a3 3 0 0 0 3 3h9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4.5\" stroke-linejoin=\"round\"/><path d=\"M24 36h15M24 45h10\" stroke=\"currentColor\" stroke-width=\"4.5\" stroke-linecap=\"round\"/>"}, {"id": "registration", "name": "Registration mark", "note": "The printer’s crosshair. Zero ambiguity about the trade.", "svg": "<circle cx=\"32\" cy=\"32\" r=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4.5\"/><circle cx=\"32\" cy=\"32\" r=\"4.5\" fill=\"currentColor\"/><path d=\"M32 5v9M32 50v9M5 32h9M50 32h9\" stroke=\"currentColor\" stroke-width=\"4.5\" stroke-linecap=\"round\"/>"}, {"id": "open-spread", "name": "Open spread", "note": "Two leaves, one gutter. Quiet and symmetrical.", "svg": "<path d=\"M32 21c-6-5-14-6-20-4v30c6-2 14-1 20 4z\" fill=\"currentColor\" opacity=\"0.5\"/><path d=\"M32 21c6-5 14-6 20-4v30c-6-2-14-1-20 4z\" fill=\"currentColor\"/>"}, {"id": "colophon", "name": "Colophon", "note": "A framed block of type. Formal, certificate-friendly.", "svg": "<rect x=\"11\" y=\"11\" width=\"42\" height=\"42\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4.5\"/><path d=\"M21 26h22M21 35h15\" stroke=\"currentColor\" stroke-width=\"4.5\" stroke-linecap=\"round\"/>"}, {"id": "quote-marks", "name": "Quote marks", "note": "Editorial, typographic, and distinctive at any size.", "svg": "<path d=\"M15 24h12v10a12 12 0 0 1-12 12z\" fill=\"currentColor\"/><path d=\"M37 24h12v10a12 12 0 0 1-12 12z\" fill=\"currentColor\"/>"}, {"id": "bookmark", "name": "Bookmark", "note": "Solid ribbon — the heaviest mark here, best on a tile.", "svg": "<path d=\"M18 10h28a4 4 0 0 1 4 4v40L32 43 14 54V14a4 4 0 0 1 4-4z\" fill=\"currentColor\"/>"}];
const PRESETS = ['#6e56cf', '#5c4bb8', '#087f83', '#161a22', '#b98a2f', '#c2410c'];
const state = { brand: '#6e56cf', tile: false, lockup: false, radius: 14 };

const $ = (id) => document.getElementById(id);
const root = document.documentElement;

function wrap(mark, opts) {
  const { tile, brand, radius } = opts;
  const inner = mark.svg.replaceAll('currentColor', tile ? '#ffffff' : brand);
  const bg = tile ? `<rect width="64" height="64" rx="${radius}" fill="${brand}"/>` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">${bg}${inner}</svg>`;
}

function paint() {
  root.style.setProperty('--brand', state.brand);
  $('picker').value = state.brand;
  document.querySelectorAll('.sw').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.c === state.brand)));
  // size strip
  const first = MARKS[0];
  $('sizes').innerHTML = [16, 24, 32, 48, 64, 96].map((px) => `
    <div class="size">
      <div class="${state.tile ? 'tilewrap' : ''}" style="line-height:0;${state.tile ? `border-radius:${Math.round(px * 0.22)}px;padding:${Math.round(px * 0.14)}px` : ''}">
        <svg viewBox="0 0 64 64" style="width:${px}px;height:${px}px;display:block">${(state.tile ? first.svg.replaceAll('currentColor', '#fff') : first.svg)}</svg>
      </div>
      <em>${px}px</em>
    </div>`).join('');
  // cards
  $('grid').innerHTML = MARKS.map((m) => `
    <div class="card">
      ${state.lockup
        ? `<div class="art"><span class="lockup"><span class="badge" style="border-radius:8px;padding:5px;display:grid;place-items:center"><svg viewBox="0 0 64 64" style="width:26px;height:26px;color:#fff">${m.svg.replaceAll('currentColor', '#fff')}</svg></span>StudioPress</span></div>`
        : `<div class="art"><div class="${state.tile ? 'tilewrap' : ''}" style="${state.tile ? `border-radius:${state.radius}px` : ''}"><svg viewBox="0 0 64 64" style="${state.tile ? '' : 'color:var(--brand)'}">${state.tile ? m.svg.replaceAll('currentColor', '#fff') : m.svg}</svg></div></div>`}
      <div class="name">${m.name}</div>
      <div class="note">${m.note}</div>
      <div class="actions">
        <button class="act" data-copy="${m.id}">Copy SVG</button>
        <button class="act" data-svg="${m.id}">SVG</button>
        <button class="act primary" data-png="${m.id}">PNG 512</button>
      </div>
    </div>`).join('');
}

function download(name, blobOrText, type) {
  const blob = blobOrText instanceof Blob ? blobOrText : new Blob([blobOrText], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('on'), 1600);
}

document.addEventListener('click', async (e) => {
  const copy = e.target.closest('[data-copy]');
  const svgBtn = e.target.closest('[data-svg]');
  const pngBtn = e.target.closest('[data-png]');
  const sw = e.target.closest('.sw');
  if (sw) { state.brand = sw.dataset.c; paint(); return; }
  const pick = (id) => MARKS.find((m) => m.id === id);
  if (copy) {
    const markup = wrap(pick(copy.dataset.copy), state);
    try { await navigator.clipboard.writeText(markup); toast('SVG copied'); }
    catch { toast('Copy blocked by the browser — use SVG'); }
    return;
  }
  if (svgBtn) {
    const m = pick(svgBtn.dataset.svg);
    download(`studiopress-${m.id}${state.tile ? '-tile' : ''}.svg`, wrap(m, state), 'image/svg+xml');
    toast('SVG downloaded');
    return;
  }
  if (pngBtn) {
    const m = pick(pngBtn.dataset.png);
    const svg = wrap(m, state);
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 512, 512);
      canvas.toBlob((blob) => { download(`studiopress-${m.id}.png`, blob); toast('PNG downloaded'); });
    };
    img.onerror = () => toast('PNG failed — use the SVG');
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
  }
});

$('swatches').innerHTML = PRESETS.map((c) =>
  `<button class="sw" data-c="${c}" style="background:${c}" aria-label="${c}" aria-pressed="false"></button>`).join('');
$('picker').addEventListener('input', (e) => { state.brand = e.target.value; paint(); });
$('tile').addEventListener('change', (e) => { state.tile = e.target.checked; paint(); });
$('radius').addEventListener('input', (e) => { state.radius = Number(e.target.value); paint(); });
$('lockupView').addEventListener('change', (e) => { state.lockup = e.target.checked; paint(); });
paint();
</script>
</body>
</html>
